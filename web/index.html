<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Prism — 통계자료를 중심으로 여러 기사를 읽는 뉴스 포털.">
  <title>Prism · 하나의 자료, 여러 시선</title>
  <link rel="icon" href="assets/prism.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=0.10">
  <script src="data.js?v=0.10" defer></script>
  <script src="app.js?v=0.10" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="masthead wrap">
      <a class="brand" href="#/" aria-label="Prism 홈">
        <img src="assets/prism.svg" alt="" width="29" height="29">
        <span>Prism<span class="brand-period">.</span></span><span class="brand-channel">뉴스</span>
      </a>
      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="search">뉴스 검색</label>
        <input id="search" name="q" placeholder="뉴스·통계 검색" autocomplete="off" maxlength="120">
        <button type="submit" aria-label="검색">⌕</button>
      </form>
    </div>
    <nav class="section-nav wrap" aria-label="뉴스 메뉴"><a href="#/">전체 뉴스</a></nav>
  </header>
  <main id="main" class="wrap" tabindex="-1"></main>
  <footer class="site-footer wrap">
    <a class="footer-brand" href="#/">Prism.</a>
    <span>하나의 자료에서 시작하는, 더 넓은 뉴스.</span>
    <div><a href="https://kosis.kr/" target="_blank" rel="noopener noreferrer">KOSIS ↗</a><button type="button" id="footer-info">서비스 안내</button></div>
  </footer>
  <dialog id="info-dialog" aria-labelledby="info-title">
    <button type="button" class="dialog-close" id="info-close" aria-label="안내 닫기">×</button>
    <h2 id="info-title">Prism</h2>
    <p>국가데이터처 RSS의 제목만 읽어 뉴스 검색에 사용합니다. 저장된 기사 중 본문이 준비된 기사를 우선해서 보여줍니다.</p>
    <p>연관 기사는 같은 검색어로 수집된 기사 중 네이버 API가 반환한 순서를 기준으로 보여줍니다.</p>
    <p>기사 본문은 원문 페이지에서 추출한 텍스트로 일부가 누락될 수 있습니다. 본문이 없는 기사는 검색 요약과 원문 링크를 제공합니다. 대표 이미지가 없거나 표시되지 않으면 공통 이미지를 사용합니다.</p>
  </dialog>
</body>
</html>
